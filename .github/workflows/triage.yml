name: Triage discovered opportunity

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: 'Lead ID copied from the review queue'
        required: true
        type: string
      status:
        description: 'Persist this review decision'
        required: true
        type: choice
        options:
          - needs_research
          - ready_for_review
          - rejected
      note:
        description: 'Review findings or rejection rationale'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cybergrc-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record review decision
        env:
          LEAD_ID: ${{ inputs.lead_id }}
          LEAD_STATUS: ${{ inputs.status }}
          REVIEW_NOTE: ${{ inputs.note }}
        run: python3 scripts/triage.py
      - name: Publish updated triage state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/triage.json
          if git diff --cached --quiet; then
            echo "No triage change"
          else
            git commit -m "Update review queue triage [skip ci]"
            git push origin HEAD:main
          fi
