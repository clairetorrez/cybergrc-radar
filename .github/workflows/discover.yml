name: Daily opportunity discovery

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover.py'
      - '.github/workflows/discover.yml'

permissions:
  contents: write

concurrency:
  group: cybergrc-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Scan official provider pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Collect opportunity leads
        run: python3 scripts/discover.py
      - name: Update published discovery catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json
          if git diff --cached --quiet; then
            echo "No discovery changes to publish"
          else
            git commit -m "Refresh discovery feed [skip ci]"
            git push origin HEAD:main
          fi
