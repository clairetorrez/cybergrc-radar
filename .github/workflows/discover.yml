name: Daily opportunity discovery

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybergrc-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Scan official provider pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Validate pipeline scripts and homepage JavaScript
        run: |
          python3 -m py_compile scripts/discover.py scripts/merge_research.py scripts/auto_publish.py scripts/revalidate.py scripts/update_news.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/cybergrc-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cybergrc-inline.js
      - name: Collect opportunity leads
        run: python3 scripts/discover.py
      - name: Merge researched leads into review queue
        run: python3 scripts/merge_research.py
      - name: Promote clearly supported offers automatically
        run: python3 scripts/auto_publish.py
      - name: Recheck published offers for drift or expiration
        run: python3 scripts/revalidate.py
      - name: Refresh GRC news from official and industry RSS feeds
        run: python3 scripts/update_news.py
      - name: Update published discovery and review status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json data/revalidation.json data/approved.json data/auto_decisions.json data/grc_news.json
          if git diff --cached --quiet; then
            echo "No discovery changes to publish"
          else
            git commit -m "Refresh discovery feed [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected, rebasing before retry $attempt"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                git reset --hard origin/main
                python3 scripts/discover.py
                python3 scripts/merge_research.py
                python3 scripts/auto_publish.py
                python3 scripts/revalidate.py
                python3 scripts/update_news.py
                git add data/discovery.json data/revalidation.json data/approved.json data/auto_decisions.json
                if git diff --cached --quiet; then
                  exit 0
                fi
                git commit -m "Refresh discovery feed after concurrent update [skip ci]"
              fi
            done
            exit 1
          fi
