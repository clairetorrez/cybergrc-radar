name: Daily opportunity discovery

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybergrc-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Scan official provider pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Collect opportunity leads
        run: python3 scripts/discover.py
      - name: Promote clearly supported offers automatically
        run: python3 scripts/auto_publish.py
      - name: Recheck published offers for drift or expiration
        run: python3 scripts/revalidate.py
      - name: Update published discovery and review status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json data/revalidation.json data/approved.json data/auto_decisions.json
          if git diff --cached --quiet; then
            echo "No discovery changes to publish"
          else
            git commit -m "Refresh discovery feed [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected, rebasing before retry $attempt"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                git reset --hard origin/main
                python3 scripts/discover.py
                python3 scripts/auto_publish.py
                python3 scripts/revalidate.py
                git add data/discovery.json data/revalidation.json
                if git diff --cached --quiet; then
                  exit 0
                fi
                git commit -m "Refresh discovery feed after concurrent update [skip ci]"
              fi
            done
            exit 1
          fi
