name: Propose a verified opportunity

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: "ID from the Discovery feed's data/discovery.json"
        required: true
        type: string
      kind:
        description: "Opportunity type. Confirm this on the official source page."
        required: true
        type: choice
        options:
          - Free exam
          - Free certification
          - Free credential
          - Discount
          - Event discount
          - Free training
          - Free simulation
          - Volunteer
          - Scholarship
      price:
        description: "Exact price, savings, or Free. Never guess."
        required: true
        type: string
      description:
        description: "What does the offer include? At least 25 characters."
        required: true
        type: string
      eligibility:
        description: "Who qualifies? At least 15 characters."
        required: true
        type: string
      deadline:
        description: "Confirmed expiration YYYY-MM-DD, or empty if none published."
        required: false
        type: string
      area:
        description: "Topic, e.g. ISO 27001, AI governance, CMMC, SOX/ITGC."
        required: false
        type: string
      frameworks:
        description: "Comma-separated frameworks, if applicable."
        required: false
        type: string
      code:
        description: "Verified promo code, if applicable."
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    name: Create a review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Generate proposed catalog entry
        env:
          REVIEW_LEAD_ID: ${{ inputs.lead_id }}
          REVIEW_KIND: ${{ inputs.kind }}
          REVIEW_PRICE: ${{ inputs.price }}
          REVIEW_DESCRIPTION: ${{ inputs.description }}
          REVIEW_ELIGIBILITY: ${{ inputs.eligibility }}
          REVIEW_DEADLINE: ${{ inputs.deadline }}
          REVIEW_AREA: ${{ inputs.area }}
          REVIEW_FRAMEWORKS: ${{ inputs.frameworks }}
          REVIEW_CODE: ${{ inputs.code }}
        run: python3 scripts/review_offer.py
      - name: Commit proposed offer to a review branch
        id: branch
        run: |
          set -euo pipefail
          branch="review-offer-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved.json
          git diff --cached --quiet && { echo "No catalog changes to propose"; exit 1; }
          git commit -m "Propose provider-verified opportunity for review"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open approval pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REVIEW_LEAD_ID: ${{ inputs.lead_id }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Review opportunity: $REVIEW_LEAD_ID" \
            --body "Please check the provider's official page, price, eligibility, expiration, promo code, and credential type. This PR adds the offer to the published catalog only if merged. The auto-discovery system does not verify offers."
